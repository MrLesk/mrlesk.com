name: Publish static site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-static-site.yml
      - .gitmodules
      - astro.config.mjs
      - bun.lock
      - package.json
      - public/**
      - src/**
      - talks/**
      - slidev-build.package.json
      - slidev-theme-codex/**
      - slidev-theme-codex-dark/**
      - slidev-theme-penguin
      - deploy/talks.json
      - scripts/assemble-site-release.ts
      - scripts/release-plan.ts
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild the site and every talk
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: static-site-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_site: ${{ steps.release_plan.outputs.build_site }}
      talk_count: ${{ steps.release_plan.outputs.talk_count }}
      has_changes: ${{ steps.release_plan.outputs.has_changes }}
      full: ${{ steps.release_plan.outputs.full }}
      talk_matrix: ${{ steps.release_plan.outputs.talk_matrix }}
      previous_tag: ${{ steps.previous_release.outputs.tag }}
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Find the previous published site
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          tag="$(jq -r '[.[] | select(.draft == false and (.tag_name | startswith("site-")))] | sort_by(.created_at) | last | .tag_name // empty' releases.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Name this release
        id: release_tag
        run: echo "tag=site-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Determine changed files
        id: changes
        env:
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
          MANUAL_FULL: ${{ inputs.full_rebuild || false }}
        run: |
          full=false
          : > changed-files.txt

          if [[ "$MANUAL_FULL" == "true" || -z "$PREVIOUS_TAG" ]]; then
            full=true
          else
            git fetch --force origin "refs/tags/${PREVIOUS_TAG}:refs/tags/${PREVIOUS_TAG}"
            git diff --name-only "${PREVIOUS_TAG}^{commit}" "$GITHUB_SHA" > changed-files.txt
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Create build plan
        id: release_plan
        run: |
          bun scripts/release-plan.ts \
            --manifest deploy/talks.json \
            --changed-files changed-files.txt \
            --output plan.json \
            --full "${{ steps.changes.outputs.full }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: plan.json
          retention-days: 1

  build_site:
    needs: plan
    if: needs.plan.outputs.build_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-astro-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: component-site
          path: dist
          retention-days: 1
          compression-level: 0

  build_talks:
    needs: plan
    if: needs.plan.outputs.talk_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.talk_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-slidev-${{ runner.os }}-${{ hashFiles('slidev-build.package.json') }}

      - name: Install shared Slidev dependencies
        run: |
          mkdir .slidev-build
          cp slidev-build.package.json .slidev-build/package.json
          ln -s ../slidev-theme-penguin .slidev-build/slidev-theme-penguin
          ln -s ../slidev-theme-codex .slidev-build/slidev-theme-codex
          ln -s ../slidev-theme-codex-dark .slidev-build/slidev-theme-codex-dark
          (cd .slidev-build && bun install --no-save)
          ln -s .slidev-build/node_modules node_modules

      - name: Build ${{ matrix.id }}
        working-directory: ${{ matrix.source }}
        run: bun run build -- --base "${{ matrix.base }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.source }}/dist
          retention-days: 1
          compression-level: 0

  assemble:
    needs: [plan, build_site, build_talks]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has_changes == 'true' &&
      (needs.build_site.result == 'success' || needs.build_site.result == 'skipped') &&
      (needs.build_talks.result == 'success' || needs.build_talks.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Start with the previous complete release
        if: needs.plan.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          mkdir -p previous release
          gh release download "$PREVIOUS_TAG" --pattern mrlesk-site.tar.gz --dir previous
          tar -xzf previous/mrlesk-site.tar.gz -C release

      - name: Assemble complete release
        run: |
          bun scripts/assemble-site-release.ts \
            --manifest deploy/talks.json \
            --plan artifacts/release-plan/plan.json \
            --artifacts artifacts \
            --release release \
            --commit "$GITHUB_SHA" \
            --release-name "${{ needs.plan.outputs.release_tag }}"

          tar -C release -czf mrlesk-site.tar.gz .
          sha256sum mrlesk-site.tar.gz > mrlesk-site.tar.gz.sha256
          cp release/.release.json release.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          cat > release-notes.md <<EOF
          Static mrlesk.com release for commit ${GITHUB_SHA}.

          Built by GitHub Actions. The Raspberry Pi downloads and activates this archive; it does not compile the project.
          EOF

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "mrlesk.com ${GITHUB_SHA::12}" \
            --notes-file release-notes.md \
            mrlesk-site.tar.gz \
            mrlesk-site.tar.gz.sha256 \
            release.json

      - name: Retain the newest two GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t old_tags < <(
            gh release list --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("site-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName'
          )

          for tag in "${old_tags[@]}"; do
            gh release delete "$tag" --cleanup-tag --yes
          done
