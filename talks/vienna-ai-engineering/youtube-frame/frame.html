<!doctype html>
<html lang="en" style="overflow: hidden">
  <head>
    <meta charset="utf-8" />
    <title>Vienna AI Engineering: YouTube frame</title>
    <!--
      The frame around the YouTube recordings of Vienna AI Engineering talks: a 1920 x 1080 page with two windows,
      one for the camera and one for the speaker's screen. Run ./render.sh to turn it into frame.png, put that
      picture on the bottom track of the video editor, and lay the two videos over the two windows.

      Everything is placed with inline styles, in pixels from the top-left corner of the page:
        - to move or resize a window, change its left, top, width and height. They are the exact rectangle of the
          video. The white edge around it is drawn outside that rectangle (the outline), so it needs no arithmetic;
        - each window prints its own rectangle, so the numbers to type into the video editor are on screen;
        - the white card behind the camera holds the speaker's name: change its two lines for another speaker.

      background.png was painted by Codex in the style of the meetup's banner; the skyline along the bottom is part
      of that picture. Codex also painted a large Austrian flag top right, which is painted over in background.png:
      the small flag and the line next to it are drawn by this page, so they can be moved and resized like the rest.
    -->
  </head>
  <body
    style="
      position: relative;
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #eef4fc url(background.png) 0 0 / 1920px 1080px no-repeat;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    "
  >
    <!-- The meetup's logo, top left. -->
    <img
      src="vaie-logo.png"
      alt="Vienna AI Engineering"
      style="position: absolute; left: 40px; top: 21px; height: 104px"
    />

    <!--
      Top right: the evening's theme and a small Austrian flag. The text is placed from the right edge of the page,
      so it stays next to the flag when its wording changes.
    -->
    <div
      style="
        position: absolute;
        right: 124px;
        top: 51px;
        font-size: 32px;
        font-weight: 700;
        line-height: 44px;
        white-space: nowrap;
        color: #0f2d6b;
      "
    >
      Tools Made in Austria
    </div>
    <div
      style="
        position: absolute;
        left: 1816px;
        top: 51px;
        width: 66px;
        height: 44px;
        background: linear-gradient(#ed2939 33.4%, #ffffff 33.4% 66.6%, #ed2939 66.6%);
        border-radius: 4px;
        box-shadow: 0 2px 10px rgba(15, 45, 107, 0.2);
      "
    ></div>

    <!--
      The white card behind the camera, with the speaker's name under the camera. It starts 10px outside the camera
      window on the left, top and right, so the two read as one card: when the camera window moves or changes
      size, change this card too. To drop the name, delete this block and give the camera the screen's box-shadow.
    -->
    <div
      style="
        position: absolute;
        left: 38px;
        top: 146px;
        width: 540px;
        height: 722px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 22px 60px rgba(15, 45, 107, 0.24);
      "
    >
      <!-- The logo and the two lines are placed from the card's bottom-left corner. -->
      <img src="pi-logo.svg" alt="" style="position: absolute; left: 34px; bottom: 45px; width: 92px; height: 92px" />
      <div
        style="position: absolute; left: 152px; bottom: 83px; font-size: 46px; font-weight: 700; line-height: 54px; color: #0f2d6b"
      >
        Mario Zechner
      </div>
      <div
        style="position: absolute; left: 154px; bottom: 45px; font-size: 30px; font-weight: 600; line-height: 38px; color: #5a76ad"
      >
        pi durable
      </div>
    </div>

    <!-- Window 1: the camera. left, top, width and height are the video's rectangle. Its shadow is the card's. -->
    <div
      id="camera"
      style="
        position: absolute;
        left: 48px;
        top: 156px;
        width: 520px;
        height: 520px;
        background: linear-gradient(160deg, #143579, #0a1d47);
        border-radius: 8px;
        outline: 10px solid #ffffff;
      "
    >
      <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center">
        <div style="font-size: 30px; font-weight: 700; letter-spacing: 8px; color: #c9d8f5">CAMERA</div>
        <div id="camera-size" style="margin-top: 10px; font-size: 22px; color: #8ea7da"></div>
      </div>
    </div>

    <!-- Window 2: the speaker's screen, 16:9. left, top, width and height are the video's rectangle. -->
    <div
      id="screen"
      style="
        position: absolute;
        left: 624px;
        top: 156px;
        width: 1248px;
        height: 702px;
        background: linear-gradient(160deg, #143579, #0a1d47);
        border-radius: 8px;
        outline: 10px solid #ffffff;
        box-shadow: 0 22px 60px 10px rgba(15, 45, 107, 0.24);
      "
    >
      <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center">
        <div style="font-size: 30px; font-weight: 700; letter-spacing: 8px; color: #c9d8f5">SCREEN</div>
        <div id="screen-size" style="margin-top: 10px; font-size: 22px; color: #8ea7da"></div>
      </div>
    </div>

    <script>
      // Prints each window's rectangle inside it, read from the styles above, so the label can never disagree with
      // the window. The videos cover these labels in the finished video.
      for (const id of ['camera', 'screen']) {
        const video = document.getElementById(id)
        document.getElementById(id + '-size').textContent =
          `${video.offsetWidth} × ${video.offsetHeight} at x ${video.offsetLeft}, y ${video.offsetTop}`
      }
    </script>
  </body>
</html>
